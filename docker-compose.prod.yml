services:
  # 1. PostgreSQL Relational Database
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ecommerce_db}
      POSTGRES_USER: ${DB_USERNAME:-ecommerce_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_db_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ecommerce_user} -d ${DB_DATABASE:-ecommerce_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce_prod_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. Redis Cache & Queue Broker
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-secret_redis_password}", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret_redis_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce_prod_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. Laravel Application (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecommerce-app:prod
    container_name: ecommerce-app
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_ROLE: app
      AUTO_MIGRATE: "true"
    volumes:
      - storage_uploads:/var/www/html/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce_prod_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 4. Nginx Web Server (Reverse Proxy & Static Asset Server)
  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      args:
        APP_IMAGE: ecommerce-app:prod
    image: ecommerce-web:prod
    container_name: ecommerce-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - storage_uploads:/var/www/html/public/storage:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/html/public/.well-known:ro
    depends_on:
      - app
    networks:
      - ecommerce_prod_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 5. Background Queue Worker
  queue:
    image: ecommerce-app:prod
    container_name: ecommerce-queue
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_ROLE: queue
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    volumes:
      - storage_uploads:/var/www/html/storage/app/public
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce_prod_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 6. Scheduled Tasks Runner (Cron)
  scheduler:
    image: ecommerce-app:prod
    container_name: ecommerce-scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_ROLE: scheduler
    command: ["/bin/sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"]
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce_prod_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ecommerce_prod_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage_uploads:
    driver: local
  certbot_conf:
    driver: local
  certbot_www:
    driver: local
