# =========================================================================
# Host Nginx Reverse Proxy Configuration for AWS EC2 (Ubuntu)
# Enables both Production (panchp.in) and Staging (dev.panchp.in)
# =========================================================================
# Place in: /etc/nginx/sites-available/panchp-multi.conf
# Enable with: sudo ln -s /etc/nginx/sites-available/panchp-multi.conf /etc/nginx/sites-enabled/
# SSL Setup: sudo certbot --nginx -d panchp.in -d www.panchp.in -d dev.panchp.in
# =========================================================================

# -------------------------------------------------------------------------
# 1. PRODUCTION: panchp.in & www.panchp.in -> Docker port 8080
# -------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name panchp.in www.panchp.in;

    client_max_body_size 64M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (Inertia/Vite if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
    }
}

# -------------------------------------------------------------------------
# 2. STAGING: dev.panchp.in -> Docker port 8081
# -------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name dev.panchp.in;

    client_max_body_size 64M;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
    }
}
