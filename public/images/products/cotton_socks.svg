<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="socksCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <linearGradient id="sockGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d1d17"/>
      <stop offset="40%" stop-color="#4a3328"/>
      <stop offset="80%" stop-color="#3d281e"/>
      <stop offset="100%" stop-color="#22140f"/>
    </linearGradient>
    <linearGradient id="sockGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f1410"/>
      <stop offset="40%" stop-color="#3b271d"/>
      <stop offset="80%" stop-color="#2f1d15"/>
      <stop offset="100%" stop-color="#170c08"/>
    </linearGradient>
    <filter id="sockShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="3" dy="8" stdDeviation="8" flood-color="#1a0f0a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="28" fill="url(#socksCardBg)"/>
  <ellipse cx="250" cy="440" rx="160" ry="20" fill="#cbd5e1" opacity="0.6"/>

  <g filter="url(#sockShadow)">
    <!-- Back Sock (Right leg) -->
    <g transform="translate(45, -20)">
      <!-- Leg tube -->
      <path d="M220 90 L285 90 L285 280 Q285 340 330 360 L380 380 Q395 390 390 410 Q380 430 350 430 L260 410 Q215 395 210 330 L210 90 Z" fill="url(#sockGrad2)"/>
      <!-- Ribbed cuff -->
      <rect x="210" y="85" width="75" height="40" rx="3" fill="#2d1d17"/>
      <line x1="210" y1="95" x2="285" y2="95" stroke="#4a3328" stroke-width="2"/>
      <line x1="210" y1="105" x2="285" y2="105" stroke="#4a3328" stroke-width="2"/>
      <line x1="210" y1="115" x2="285" y2="115" stroke="#4a3328" stroke-width="2"/>
      <!-- Heel patch -->
      <path d="M210 310 Q205 370 260 385 Q230 360 220 315 Z" fill="#170c08"/>
      <!-- Toe cap -->
      <path d="M350 430 Q380 430 390 410 Q395 390 380 380 Q360 410 350 430 Z" fill="#170c08"/>
    </g>

    <!-- Front Sock (Left leg) -->
    <g transform="translate(-30, 10)">
      <!-- Leg tube -->
      <path d="M190 90 L255 90 L255 270 Q255 330 300 350 L350 370 Q370 380 365 405 Q355 425 320 425 L230 400 Q185 385 180 320 L180 90 Z" fill="url(#sockGrad1)"/>
      
      <!-- Ribbed Cuff Top -->
      <rect x="180" y="85" width="75" height="42" rx="3" fill="#3b281e" stroke="#22140f" stroke-width="1.5"/>
      <line x1="180" y1="96" x2="255" y2="96" stroke="#5c3e32" stroke-width="2"/>
      <line x1="180" y1="106" x2="255" y2="106" stroke="#5c3e32" stroke-width="2"/>
      <line x1="180" y1="116" x2="255" y2="116" stroke="#5c3e32" stroke-width="2"/>

      <!-- Vertical Ribbing texture on leg -->
      <line x1="195" y1="130" x2="195" y2="280" stroke="#5c3e32" stroke-width="1.5" opacity="0.6"/>
      <line x1="210" y1="130" x2="210" y2="280" stroke="#5c3e32" stroke-width="1.5" opacity="0.6"/>
      <line x1="225" y1="130" x2="225" y2="280" stroke="#5c3e32" stroke-width="1.5" opacity="0.6"/>
      <line x1="240" y1="130" x2="240" y2="280" stroke="#5c3e32" stroke-width="1.5" opacity="0.6"/>

      <!-- Reinforced Heel Curve -->
      <path d="M180 305 Q175 365 230 378 Q200 355 190 310 Z" fill="#22140f" stroke="#170c08" stroke-width="1"/>

      <!-- Reinforced Toe Cap -->
      <path d="M320 425 Q355 425 365 405 Q370 380 350 370 Q330 405 320 425 Z" fill="#22140f" stroke="#170c08" stroke-width="1"/>
      <path d="M350 370 Q330 405 320 425" fill="none" stroke="#5c3e32" stroke-width="1.5" stroke-dasharray="3,2"/>
    </g>
  </g>
</svg>
