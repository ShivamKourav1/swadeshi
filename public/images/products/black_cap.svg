<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="capCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f2"/>
      <stop offset="100%" stop-color="#faeee0"/>
    </linearGradient>
    <linearGradient id="capBlackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="25%" stop-color="#1f2937"/>
      <stop offset="70%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="capFoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="50%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="capShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="3" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="28" fill="url(#capCardBg)"/>
  <ellipse cx="250" cy="380" rx="160" ry="25" fill="#d1d5db" opacity="0.6"/>

  <g filter="url(#capShadow)">
    <!-- Back Crown (visible inside top opening fold) -->
    <path d="M90 270 Q250 150 410 270 Q250 210 90 270 Z" fill="#0f172a"/>

    <!-- Inside Crown Valley Fold (Boat shape interior crease) -->
    <path d="M100 265 Q250 200 400 265 Q250 230 100 265 Z" fill="#030712" opacity="0.7"/>

    <!-- Main Front Body of the Cap -->
    <path d="M80 280 Q250 170 420 280 L400 350 Q250 330 100 350 Z" fill="url(#capBlackGrad)"/>

    <!-- Top Crown Ridge Highlight -->
    <path d="M80 280 Q250 170 420 280 Q250 185 80 280 Z" fill="url(#capFoldGrad)" opacity="0.4"/>

    <!-- Turn-up Front Flap Band -->
    <path d="M100 350 Q250 330 400 350 L395 320 Q250 300 105 320 Z" fill="#1f2937"/>
    
    <!-- Top edge stitch of turn-up flap -->
    <path d="M105 320 Q250 300 395 320" fill="none" stroke="#4b5563" stroke-width="2" stroke-dasharray="6,3"/>

    <!-- Bottom Hem Rim of Cap -->
    <path d="M98 350 Q250 330 402 350 L400 356 Q250 336 100 356 Z" fill="#030712"/>

    <!-- Center Vertical Form Crease / Peak -->
    <path d="M250 200 L250 335" stroke="#4b5563" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <path d="M249 200 L249 335" stroke="#111827" stroke-width="1.5" opacity="0.8"/>

    <!-- Subtle side seam curves -->
    <path d="M140 250 Q135 295 130 335" stroke="#374151" stroke-width="1.2" opacity="0.5"/>
    <path d="M360 250 Q365 295 370 335" stroke="#374151" stroke-width="1.2" opacity="0.5"/>
  </g>
</svg>
