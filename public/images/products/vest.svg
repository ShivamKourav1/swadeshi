<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="vestCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <linearGradient id="vestKnit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="20%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="vestShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#475569" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="28" fill="url(#vestCardBg)"/>
  <ellipse cx="250" cy="450" rx="140" ry="16" fill="#cbd5e1" opacity="0.6"/>

  <g filter="url(#vestShadow)">
    <!-- Main Sleeveless Vest Body -->
    <path d="M165 95 L200 95 C190 145 220 180 250 180 C280 180 310 145 300 95 L335 95 C330 160 370 200 370 240 L360 430 L140 430 L130 240 C130 200 170 160 165 95 Z" fill="url(#vestKnit)" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Scoop Neckline Ribbed Trim (Binding tape) -->
    <path d="M200 95 C190 145 220 180 250 180 C280 180 310 145 300 95" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>
    <path d="M200 95 C190 145 220 180 250 180 C280 180 310 145 300 95" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2"/>

    <!-- Left Armhole Ribbed Trim -->
    <path d="M165 95 C170 160 130 200 130 240" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>
    <path d="M165 95 C170 160 130 200 130 240" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2"/>

    <!-- Right Armhole Ribbed Trim -->
    <path d="M335 95 C330 160 370 200 370 240" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>
    <path d="M335 95 C330 160 370 200 370 240" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2"/>

    <!-- Vertical Ribbing Texture Lines (Fine combed cotton knit) -->
    <line x1="175" y1="210" x2="175" y2="425" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="195" y1="190" x2="195" y2="425" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="215" y1="185" x2="215" y2="425" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="235" y1="185" x2="235" y2="425" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="250" y1="185" x2="250" y2="425" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="265" y1="185" x2="265" y2="425" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="285" y1="185" x2="285" y2="425" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="305" y1="190" x2="305" y2="425" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="325" y1="210" x2="325" y2="425" stroke="#f1f5f9" stroke-width="1.5"/>

    <!-- Bottom Double Stitch Hem -->
    <rect x="140" y="420" width="220" height="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="140" y1="423" x2="360" y2="423" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="140" y1="428" x2="360" y2="428" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>

    <!-- Inner neck label printed branding -->
    <rect x="235" y="195" width="30" height="16" rx="2" fill="#e2e8f0" opacity="0.6"/>
    <line x1="240" y1="202" x2="260" y2="202" stroke="#94a3b8" stroke-width="1"/>
    <line x1="244" y1="206" x2="256" y2="206" stroke="#94a3b8" stroke-width="1"/>
  </g>
</svg>
