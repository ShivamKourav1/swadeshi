<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bookCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#feede0"/>
    </linearGradient>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="30%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="80%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="pageStack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="bookShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="4" dy="12" stdDeviation="10" flood-color="#451a03" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="28" fill="url(#bookCardBg)"/>
  <ellipse cx="250" cy="445" rx="170" ry="20" fill="#cbd5e1" opacity="0.6"/>

  <g filter="url(#bookShadow)">
    <!-- Page Block Edges (Bottom & Right) -->
    <polygon points="120,410 390,410 410,390 140,390" fill="url(#pageStack)" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Page Lines on Bottom Edge -->
    <line x1="125" y1="400" x2="395" y2="400" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
    <line x1="130" y1="405" x2="400" y2="405" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>

    <polygon points="390,410 410,390 410,105 390,125" fill="url(#pageStack)" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Page lines on right edge -->
    <line x1="395" y1="120" x2="395" y2="405" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
    <line x1="402" y1="112" x2="402" y2="398" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>

    <!-- Bookmark Ribbon (Golden) -->
    <path d="M260 85 L260 435 L275 420 L290 435 L290 85 Z" fill="url(#goldFoil)" filter="url(#bookShadow)"/>

    <!-- Front Book Cover -->
    <rect x="110" y="80" width="280" height="325" rx="10" fill="url(#coverGrad)" stroke="#78350f" stroke-width="2"/>

    <!-- Spine Ridge on Left -->
    <rect x="110" y="80" width="24" height="325" rx="4" fill="#78350f"/>
    <line x1="134" y1="80" x2="134" y2="405" stroke="#451a03" stroke-width="2"/>
    <line x1="136" y1="80" x2="136" y2="405" stroke="#fde047" stroke-width="1" opacity="0.6"/>

    <!-- Gold Foil Ornamental Borders -->
    <rect x="150" y="105" width="215" height="275" rx="6" fill="none" stroke="url(#goldFoil)" stroke-width="3"/>
    <rect x="156" y="111" width="203" height="263" rx="4" fill="none" stroke="url(#goldFoil)" stroke-width="1"/>

    <!-- Corner Decorative Filigree Elements -->
    <circle cx="160" cy="115" r="4" fill="url(#goldFoil)"/>
    <circle cx="355" cy="115" r="4" fill="url(#goldFoil)"/>
    <circle cx="160" cy="370" r="4" fill="url(#goldFoil)"/>
    <circle cx="355" cy="370" r="4" fill="url(#goldFoil)"/>

    <!-- Center Radiant Mandala / Diya Emblem -->
    <circle cx="258" cy="190" r="42" fill="#78350f" stroke="url(#goldFoil)" stroke-width="2"/>
    <circle cx="258" cy="190" r="34" fill="none" stroke="url(#goldFoil)" stroke-width="1.5" stroke-dasharray="4,2"/>
    <!-- Deepam / Flame Motif -->
    <path d="M258 165 C248 185 244 195 244 202 C244 212 250 216 258 216 C266 216 272 212 272 202 C272 195 268 185 258 165 Z" fill="url(#goldFoil)"/>
    <ellipse cx="258" cy="204" rx="4" ry="7" fill="#fff" opacity="0.8"/>

    <!-- Book Title & Subtitle (Clear Vector Hindi/Devanagari Styling) -->
    <!-- Main Title Banner -->
    <rect x="165" y="255" width="186" height="42" rx="6" fill="#78350f" stroke="url(#goldFoil)" stroke-width="1.5"/>
    <text x="258" y="284" font-family="'Noto Sans Devanagari', 'Mangal', 'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="url(#goldFoil)" text-anchor="middle" letter-spacing="1">बोध कथाएं</text>

    <!-- Subtitle -->
    <text x="258" y="322" font-family="'Noto Sans Devanagari', 'Mangal', 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#fef08a" text-anchor="middle">प्रेरक जीवन प्रसंग</text>

    <!-- Bottom Emblem / Publisher Seal -->
    <line x1="200" y1="345" x2="315" y2="345" stroke="url(#goldFoil)" stroke-width="1.5"/>
    <polygon points="258,340 263,345 258,350 253,345" fill="url(#goldFoil)"/>
  </g>
</svg>
