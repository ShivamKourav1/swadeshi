<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="knickerCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f5ede0"/>
    </linearGradient>
    <linearGradient id="khakiCloth" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a7b56"/>
      <stop offset="35%" stop-color="#bda07b"/>
      <stop offset="70%" stop-color="#a88965"/>
      <stop offset="100%" stop-color="#8c6f4c"/>
    </linearGradient>
    <filter id="knickerShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#4a3720" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="28" fill="url(#knickerCardBg)"/>
  <ellipse cx="250" cy="450" rx="160" ry="18" fill="#d4c3b0" opacity="0.6"/>

  <g filter="url(#knickerShadow)">
    <!-- Main Shorts Body (Knickers) -->
    <path d="M150 110 L350 110 L370 180 L350 390 L262 390 L250 260 L238 390 L150 390 L130 180 Z" fill="url(#khakiCloth)"/>

    <!-- Waistband -->
    <path d="M150 110 L350 110 L353 145 L147 145 Z" fill="#8c6f4c"/>
    <line x1="147" y1="145" x2="353" y2="145" stroke="#6d5438" stroke-width="2"/>

    <!-- Belt Loops -->
    <rect x="165" y="108" width="8" height="40" rx="2" fill="#a88965" stroke="#6d5438" stroke-width="1"/>
    <rect x="215" y="108" width="8" height="40" rx="2" fill="#a88965" stroke="#6d5438" stroke-width="1"/>
    <rect x="277" y="108" width="8" height="40" rx="2" fill="#a88965" stroke="#6d5438" stroke-width="1"/>
    <rect x="327" y="108" width="8" height="40" rx="2" fill="#a88965" stroke="#6d5438" stroke-width="1"/>

    <!-- Center Fly & Button -->
    <circle cx="250" cy="128" r="5" fill="#4a3720" stroke="#bda07b" stroke-width="1.5"/>
    <path d="M250 145 L250 220 Q250 245 240 260" fill="none" stroke="#6d5438" stroke-width="2.5" stroke-dasharray="4,2"/>

    <!-- Front Pleats -->
    <line x1="200" y1="145" x2="195" y2="330" stroke="#8c6f4c" stroke-width="2"/>
    <line x1="199" y1="145" x2="194" y2="330" stroke="#d4c3b0" stroke-width="1" opacity="0.6"/>

    <line x1="300" y1="145" x2="305" y2="330" stroke="#8c6f4c" stroke-width="2"/>
    <line x1="301" y1="145" x2="306" y2="330" stroke="#d4c3b0" stroke-width="1" opacity="0.6"/>

    <!-- Deep Slash Side Pockets -->
    <path d="M148 150 L180 210" stroke="#6d5438" stroke-width="3" stroke-linecap="round"/>
    <path d="M352 150 L320 210" stroke="#6d5438" stroke-width="3" stroke-linecap="round"/>

    <!-- Crotch Shadow -->
    <path d="M238 260 Q250 245 262 260 Q250 290 238 260 Z" fill="#4a3720" opacity="0.35"/>

    <!-- Wide Flared Leg Hems -->
    <rect x="150" y="375" width="88" height="16" rx="2" fill="#8c6f4c" stroke="#6d5438" stroke-width="1"/>
    <line x1="150" y1="380" x2="238" y2="380" stroke="#bda07b" stroke-width="1" stroke-dasharray="4,2"/>

    <rect x="262" y="375" width="88" height="16" rx="2" fill="#8c6f4c" stroke="#6d5438" stroke-width="1"/>
    <line x1="262" y1="380" x2="350" y2="380" stroke="#bda07b" stroke-width="1" stroke-dasharray="4,2"/>
  </g>
</svg>
