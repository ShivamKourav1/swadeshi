<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rashtriyaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="maroonCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="40%" stop-color="#9f1239"/>
      <stop offset="80%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="pageLayers" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="rBookShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="4" dy="12" stdDeviation="10" flood-color="#4c0519" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="28" fill="url(#rashtriyaBg)"/>
  <ellipse cx="250" cy="445" rx="170" ry="20" fill="#cbd5e1" opacity="0.6"/>

  <g filter="url(#rBookShadow)">
    <!-- Page Block Edges (Bottom & Right) -->
    <polygon points="120,410 390,410 410,390 140,390" fill="url(#pageLayers)" stroke="#cbd5e1" stroke-width="1"/>
    <polygon points="390,410 410,390 410,105 390,125" fill="url(#pageLayers)" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Bookmark Ribbon (Saffron / Orange) -->
    <path d="M260 85 L260 435 L275 420 L290 435 L290 85 Z" fill="#ea580c" filter="url(#rBookShadow)"/>

    <!-- Front Book Cover -->
    <rect x="110" y="80" width="280" height="325" rx="10" fill="url(#maroonCover)" stroke="#4c0519" stroke-width="2"/>

    <!-- Spine Ridge on Left -->
    <rect x="110" y="80" width="24" height="325" rx="4" fill="#4c0519"/>
    <line x1="134" y1="80" x2="134" y2="405" stroke="#1c0209" stroke-width="2"/>
    <line x1="136" y1="80" x2="136" y2="405" stroke="#fde047" stroke-width="1" opacity="0.6"/>

    <!-- Gold Foil Geometric Borders -->
    <rect x="150" y="105" width="215" height="275" rx="6" fill="none" stroke="url(#goldTrim)" stroke-width="3"/>
    <rect x="156" y="111" width="203" height="263" rx="4" fill="none" stroke="url(#goldTrim)" stroke-width="1"/>

    <!-- Corner Decorative Diamonds -->
    <polygon points="160,111 165,116 160,121 155,116" fill="url(#goldTrim)"/>
    <polygon points="355,111 360,116 355,121 350,116" fill="url(#goldTrim)"/>
    <polygon points="160,369 165,374 160,379 155,374" fill="url(#goldTrim)"/>
    <polygon points="355,369 360,374 355,379 350,374" fill="url(#goldTrim)"/>

    <!-- Central Rising Sun & Torch of Character Symbol -->
    <circle cx="258" cy="190" r="44" fill="#4c0519" stroke="url(#goldTrim)" stroke-width="2"/>
    <!-- Sun Rays -->
    <g stroke="url(#goldTrim)" stroke-width="2" opacity="0.8">
      <line x1="258" y1="136" x2="258" y2="144"/>
      <line x1="296" y1="152" x2="290" y2="158"/>
      <line x1="312" y1="190" x2="304" y2="190"/>
      <line x1="220" y1="152" x2="226" y2="158"/>
      <line x1="204" y1="190" x2="212" y2="190"/>
    </g>
    <!-- Torch & Flame Motif -->
    <path d="M258 160 Q250 178 252 186 Q255 194 258 194 Q261 194 264 186 Q266 178 258 160 Z" fill="url(#goldTrim)"/>
    <path d="M253 194 L263 194 L260 216 L256 216 Z" fill="url(#goldTrim)"/>

    <!-- Book Title & Subtitle in Hindi / Devanagari -->
    <rect x="165" y="255" width="186" height="42" rx="6" fill="#4c0519" stroke="url(#goldTrim)" stroke-width="1.5"/>
    <text x="258" y="284" font-family="'Noto Sans Devanagari', 'Mangal', 'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="url(#goldTrim)" text-anchor="middle" letter-spacing="1">राष्ट्र निर्माण</text>

    <!-- Subtitle -->
    <text x="258" y="322" font-family="'Noto Sans Devanagari', 'Mangal', 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#fef08a" text-anchor="middle">चरित्र निर्माण की दिशा</text>

    <!-- Base Floral / Kalash Accent -->
    <line x1="195" y1="345" x2="320" y2="345" stroke="url(#goldTrim)" stroke-width="1.5"/>
    <circle cx="258" cy="345" r="3.5" fill="url(#goldTrim)"/>
  </g>
</svg>
