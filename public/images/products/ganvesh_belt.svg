<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="beltCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffaf5"/>
      <stop offset="100%" stop-color="#f5ede4"/>
    </linearGradient>
    <linearGradient id="webbingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d1d17"/>
      <stop offset="30%" stop-color="#4a3227"/>
      <stop offset="70%" stop-color="#3b261d"/>
      <stop offset="100%" stop-color="#22140f"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="75%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="beltShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="3" dy="10" stdDeviation="8" flood-color="#1e1b18" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="28" fill="url(#beltCardBg)"/>
  <ellipse cx="250" cy="420" rx="170" ry="24" fill="#cbd5e1" opacity="0.5"/>

  <g filter="url(#beltShadow)">
    <!-- Coiled Belt Body Background Loops -->
    <!-- Outer Coil -->
    <path d="M120 280 C120 180 380 180 380 280 C380 380 120 380 120 280 Z" fill="none" stroke="url(#webbingGrad)" stroke-width="48" stroke-linecap="round"/>
    
    <!-- Mid Coil -->
    <path d="M160 285 C160 215 340 215 340 285 C340 355 160 355 160 285 Z" fill="none" stroke="url(#webbingGrad)" stroke-width="44" stroke-linecap="round"/>

    <!-- Belt Webbing Weave Texture Lines -->
    <path d="M120 280 C120 180 380 180 380 280" fill="none" stroke="#5c3e32" stroke-width="2" stroke-dasharray="4,3" opacity="0.7"/>
    <path d="M160 285 C160 215 340 215 340 285" fill="none" stroke="#5c3e32" stroke-width="2" stroke-dasharray="4,3" opacity="0.7"/>

    <!-- Belt Tip (Metal Clamp on Belt End) -->
    <path d="M140 260 L90 270 L90 318 L140 308 Z" fill="url(#webbingGrad)"/>
    <rect x="75" y="270" width="18" height="48" rx="4" fill="url(#chromeGrad)" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="84" cy="294" r="3" fill="#475569"/>

    <!-- Prominent Official Metallic Buckle (Foreground Center) -->
    <!-- Buckle Base Plate -->
    <rect x="240" y="235" width="145" height="96" rx="10" fill="url(#brassGrad)" stroke="#a16207" stroke-width="2.5" filter="url(#beltShadow)"/>
    
    <!-- Inner Recessed Frame -->
    <rect x="252" y="247" width="121" height="72" rx="6" fill="#ca8a04" stroke="#713f12" stroke-width="1.5"/>
    
    <!-- Chrome Roller Bar Clamping Mechanism -->
    <rect x="270" y="255" width="85" height="14" rx="4" fill="url(#chromeGrad)"/>
    <rect x="270" y="275" width="85" height="14" rx="4" fill="url(#chromeGrad)"/>
    <rect x="270" y="295" width="85" height="14" rx="4" fill="url(#chromeGrad)"/>

    <!-- Buckle Frame Borders & Catch Pin -->
    <rect x="236" y="230" width="153" height="106" rx="14" fill="none" stroke="url(#chromeGrad)" stroke-width="6"/>
    
    <!-- Catch Clamping Latch on Left of Buckle -->
    <rect x="226" y="245" width="16" height="76" rx="4" fill="url(#chromeGrad)" stroke="#475569" stroke-width="1.5"/>
    <circle cx="234" cy="265" r="2.5" fill="#334155"/>
    <circle cx="234" cy="301" r="2.5" fill="#334155"/>
  </g>
</svg>
