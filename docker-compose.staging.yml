services:
  # 1. PostgreSQL Staging Relational Database
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ecommerce_staging_db}
      POSTGRES_USER: ${DB_USERNAME:-ecommerce_staging_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_staging_db_password}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ecommerce_staging_user} -d ${DB_DATABASE:-ecommerce_staging_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce_staging_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. Redis Staging Cache & Queue Broker
  redis:
    image: redis:7-alpine
    container_name: ecommerce-staging-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-secret_staging_redis_password}", "--save", "60", "1"]
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret_staging_redis_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce_staging_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. Laravel Staging Application (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ecommerce-app:staging
    container_name: ecommerce-staging-app
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_ROLE: app
      AUTO_MIGRATE: "true"
      APP_ENV: ${APP_ENV:-staging}
    volumes:
      - storage_staging_uploads:/var/www/html/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce_staging_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 4. Nginx Web Server for Staging (dev.panchp.in)
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: ecommerce-web:staging
    container_name: ecommerce-staging-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8081}:80"
      - "${HTTPS_PORT:-8444}:443"
    volumes:
      - storage_staging_uploads:/var/www/html/public/storage:ro
      - ./docker/nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - ecommerce_staging_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 5. Background Queue Worker (Staging)
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ecommerce-app:staging
    container_name: ecommerce-staging-queue
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_ROLE: queue
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    volumes:
      - storage_staging_uploads:/var/www/html/storage/app/public
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce_staging_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 6. Scheduled Tasks Runner (Staging Cron)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ecommerce-app:staging
    container_name: ecommerce-staging-scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      CONTAINER_ROLE: scheduler
    command: ["/bin/sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"]
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce_staging_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ecommerce_staging_net:
    driver: bridge

volumes:
  postgres_staging_data:
    driver: local
  redis_staging_data:
    driver: local
  storage_staging_uploads:
    driver: local
